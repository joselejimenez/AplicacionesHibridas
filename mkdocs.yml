site_name: Aplicaciones Híbridas · 2º DAM
site_description: Material didáctico del módulo propio de centro "Aplicaciones Híbridas" (2º DAM, IES Rafael Alberti, Cádiz) con Flutter y Dart.
site_author: Departamento de Informática · IES Rafael Alberti
site_url: https://joselejimenez.github.io/AplicacionesHibridas/
repo_url: https://github.com/joselejimenez/AplicacionesHibridas
repo_name: joselejimenez/AplicacionesHibridas
edit_uri: edit/main/docs/
copyright: IES Rafael Alberti (Cádiz) · 2º DAM · Curso 2026-2027
strict: true

theme:
  name: material
  language: es
  icon:
    logo: material/cellphone-link
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

hooks:
  - hooks/ocultar.py

# ─────────────────────────────────────────────────────────────
# TEMAS OCULTOS
# Lo que aparezca aquí NO se publica: no sale en el menú ni en el
# buscador, y los enlaces que apunten a ello se ven como texto
# con «(próximamente)».
# Para publicar un tema, pon # delante de su línea (o bórrala).
# ─────────────────────────────────────────────────────────────
extra:
  ocultos:
    - tema2
    - tema3
    - tema4
    - tema5
    - tema6
    - tema7
    - proyecto

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Inicio: index.md
  - El módulo:
      - modulo/index.md
      - Hoja de ruta: modulo/hoja-de-ruta.md
      - Resultados de aprendizaje: modulo/ra.md
      - Decisión tecnológica: modulo/decision-tecnologica.md
      - Coordinación con PMDM y DI: modulo/coordinacion.md
      - Planificación: modulo/planificacion.md
  - "Tema 1 · Entorno y Dart": tema1/index.md
  - "Tema 2 · Arquitectura":
      - tema2/index.md
      - Cuatro formas de hacer una app: tema2/01-enfoques.md
      - Flutter por dentro: tema2/02-flutter-por-dentro.md
      - "Kotlin Multiplatform: la tercera vía": tema2/03-kmp.md
      - Elegir con criterio: tema2/04-comparativa.md
      - Práctica: tema2/practica.md
  - "Tema 3 · Interfaces": tema3/index.md
  - "Tema 4 · Nativas": tema4/index.md
  - "Tema 5 · Datos": tema5/index.md
  - "Tema 6 · Calidad": tema6/index.md
  - "Tema 7 · Despliegue": tema7/index.md
  - Proyecto final: proyecto/index.md
